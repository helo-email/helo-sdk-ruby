name: Publish

# Pushes the gem when a version tag (e.g. 1.0.1, 1.0.1-beta.1) is pushed, once
# the same tests that gate pull requests pass. release.yml also dispatches it
# against the tag it creates, since tags pushed with GITHUB_TOKEN don't trigger
# `push` workflows.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref_name }}

permissions:
  contents: read

jobs:
  test:
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      contents: read
      id-token: write # RubyGems trusted publishing
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Check tag matches VERSION
        run: |
          version=$(ruby -r ./lib/helo/version -e 'print Helo::VERSION')
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Helo::VERSION $version" && exit 1
          fi

      - name: Build gem
        run: gem build helo-email-sdk.gemspec

      - uses: rubygems/configure-rubygems-credentials@v1.0.0

      - name: Push gem
        run: gem push helo-email-sdk-*.gem
